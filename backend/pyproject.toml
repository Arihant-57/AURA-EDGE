[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-edge"
version = "0.1.0"
description = "AURA EDGE - Offline-first multilingual personal AI assistant (Phase 1 voice & intelligence)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    "pgvector>=0.3.0",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
    "nvidia-ml-py>=12.0.0",
    "faster-whisper>=1.1.0",
    "sherpa-onnx>=1.12.0,<2.0",
    "onnxruntime>=1.20.0",
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "hassil>=2.0.0",
    "PyYAML>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
